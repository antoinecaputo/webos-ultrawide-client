name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Prepare environment
        run: |
          rm -rf ./build/*
          mkdir ./build

      - name: Install ares-cli globally
        run: npm install -g @webosose/ares-cli

      - name: Check packaging
        run: ares-package --check

      - name: Build package
        run: ares-package --no-minify --outdir build/ services frontend

      - name: Create manifest for distribution
        run: node tools/gen-manifest.js build/com.antoine.ultrawideclient.manifest.json

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ultrawide_webos
          path: |
            ${{github.workspace}}/build/*
